<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Desenhos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rosa-claro: #FFE4EC;
      --rosa-medio: #FFB6C1;
      --rosa-forte: #F48FB1;
      --rosa-accent: #EC407A;
      --rosa-suave: #FCE4EC;
      --branco: #FFFFFF;
      --creme: #FFF8FA;
      --texto: #6D5A6E;
      --sombra: rgba(236, 64, 122, 0.12);
      --borda: #F8BBD0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: 
        radial-gradient(ellipse 120% 80% at 10% 20%, rgba(255, 182, 193, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse 100% 60% at 90% 10%, rgba(255, 192, 203, 0.3) 0%, transparent 45%),
        radial-gradient(ellipse 80% 50% at 70% 80%, rgba(255, 228, 236, 0.5) 0%, transparent 50%),
        radial-gradient(ellipse 90% 70% at 20% 90%, rgba(255, 240, 245, 0.6) 0%, transparent 45%),
        linear-gradient(165deg, #FFF5F8 0%, #FFE8F0 35%, #FFF0F5 65%, #FFFFFF 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--texto);
      line-height: 1.5;
      position: relative;
      overflow-x: hidden;
    }

    /* ========== DECORAÇÕES DE FUNDO ========== */
    .decorations {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 100px;
      filter: blur(1px);
      opacity: 0.85;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud-1 {
      width: 180px;
      height: 50px;
      top: 12%;
      left: 5%;
      animation: float 22s ease-in-out infinite;
    }
    .cloud-1::before {
      width: 70px;
      height: 70px;
      top: -35px;
      left: 25px;
    }
    .cloud-1::after {
      width: 55px;
      height: 55px;
      top: -25px;
      left: 85px;
    }

    .cloud-2 {
      width: 140px;
      height: 40px;
      top: 28%;
      right: 8%;
      animation: float 18s ease-in-out infinite reverse;
      animation-delay: -5s;
    }
    .cloud-2::before {
      width: 55px;
      height: 55px;
      top: -28px;
      left: 20px;
    }
    .cloud-2::after {
      width: 45px;
      height: 45px;
      top: -20px;
      left: 65px;
    }

    .cloud-3 {
      width: 160px;
      height: 45px;
      bottom: 18%;
      left: 12%;
      animation: float 25s ease-in-out infinite;
      animation-delay: -10s;
      opacity: 0.65;
    }
    .cloud-3::before {
      width: 60px;
      height: 60px;
      top: -30px;
      left: 22px;
    }
    .cloud-3::after {
      width: 50px;
      height: 50px;
      top: -22px;
      left: 75px;
    }

    .cloud-4 {
      width: 120px;
      height: 36px;
      bottom: 35%;
      right: 15%;
      animation: float 20s ease-in-out infinite reverse;
      animation-delay: -3s;
      opacity: 0.7;
    }
    .cloud-4::before {
      width: 48px;
      height: 48px;
      top: -24px;
      left: 18px;
    }
    .cloud-4::after {
      width: 40px;
      height: 40px;
      top: -18px;
      left: 55px;
    }

    .star {
      position: absolute;
      color: #F8BBD0;
      font-size: 18px;
      opacity: 0.55;
      animation: twinkle 3.5s ease-in-out infinite;
    }

    .star:nth-child(odd) {
      animation-delay: 1.2s;
    }

    .heart {
      position: absolute;
      color: #F48FB1;
      font-size: 14px;
      opacity: 0.4;
      animation: float 12s ease-in-out infinite;
    }

    .unicorn {
      position: absolute;
      font-size: 28px;
      opacity: 0.35;
      filter: grayscale(0.1);
      animation: float 16s ease-in-out infinite;
    }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle, #fff 20%, #F8BBD0 70%, transparent 100%);
      border-radius: 50%;
      opacity: 0;
      animation: sparkle 4s ease-in-out infinite;
    }

    .rainbow {
      position: absolute;
      width: 120px;
      height: 60px;
      border-radius: 120px 120px 0 0;
      border: 6px solid transparent;
      border-top-color: rgba(255, 182, 193, 0.35);
      border-left-color: rgba(255, 223, 186, 0.25);
      border-right-color: rgba(186, 225, 255, 0.25);
      opacity: 0.5;
      animation: float 20s ease-in-out infinite;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,182,193,0.25));
      border: 1px solid rgba(255,255,255,0.5);
      opacity: 0.4;
      animation: bubbleRise 14s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); }
      33% { transform: translateY(-14px) translateX(6px) rotate(1deg); }
      66% { transform: translateY(-8px) translateX(-5px) rotate(-1deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1) rotate(0deg); }
      50% { opacity: 0.85; transform: scale(1.25) rotate(12deg); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.4); }
      40% { opacity: 0.9; transform: scale(1.2); }
      70% { opacity: 0.4; transform: scale(0.8); }
    }

    @keyframes bubbleRise {
      0% { transform: translateY(0) scale(1); opacity: 0.35; }
      50% { transform: translateY(-40px) scale(1.1); opacity: 0.55; }
      100% { transform: translateY(-80px) scale(0.9); opacity: 0.15; }
    }

    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 14px rgba(236, 64, 122, 0.12); }
      50% { transform: scale(1.06); box-shadow: 0 6px 18px rgba(236, 64, 122, 0.2); }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 150%; }
    }

    /* Conteúdo acima das decorações */
    .header,
    .controls,
    .catalogo,
    .footer {
      position: relative;
      z-index: 1;
    }

    /* Animação de entrada das molduras */
    .frame {
      animation: fadeInUp 0.55s ease-out both;
    }

    .frame:nth-child(1) { animation-delay: 0.05s; }
    .frame:nth-child(2) { animation-delay: 0.1s; }
    .frame:nth-child(3) { animation-delay: 0.15s; }
    .frame:nth-child(4) { animation-delay: 0.2s; }
    .frame:nth-child(5) { animation-delay: 0.25s; }
    .frame:nth-child(6) { animation-delay: 0.3s; }
    .frame:nth-child(7) { animation-delay: 0.35s; }
    .frame:nth-child(8) { animation-delay: 0.4s; }
    .frame:nth-child(n+9) { animation-delay: 0.45s; }

    .frame.empty .plus-icon {
      animation: pulseSoft 2.8s ease-in-out infinite;
    }

    /* ========== HEADER ========== */
    .header {
      background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,249,251,0.88) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: none;
      box-shadow: 0 8px 32px rgba(236, 64, 122, 0.07);
      padding: 18px 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 90px;
    }

    .logo-placeholder {
      width: 112px;
      height: 112px;
      background: transparent;
      border: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .logo-placeholder:hover {
      opacity: 0.9;
    }

    .logo-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-placeholder .placeholder-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 12px;
      text-align: center;
      color: var(--rosa-forte);
      font-weight: 500;
      padding: 6px;
      line-height: 1.25;
      opacity: 0.9;
    }

    .logo-placeholder input {
      display: none;
    }

    .titulo {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 1.85rem;
      color: var(--rosa-accent);
      text-align: center;
      flex: 1;
      min-width: 220px;
      letter-spacing: -0.02em;
    }

    .titulo input {
      font-family: inherit;
      font-weight: inherit;
      font-size: inherit;
      color: inherit;
      border: none;
      background: transparent;
      text-align: center;
      width: 100%;
      outline: none;
      border-bottom: 2px solid transparent;
      padding-bottom: 2px;
      transition: border-color 0.25s ease;
    }

    .titulo input:hover,
    .titulo input:focus {
      border-bottom-color: rgba(236, 64, 122, 0.35);
    }

    .titulo input::placeholder {
      color: #F8BBD0;
      opacity: 0.8;
    }

    .social-area {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .instagram-box,
    .tiktok-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .instagram-box label,
    .tiktok-box label {
      font-family: 'Fredoka', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--rosa-forte);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .instagram-box .ig-icon,
    .tiktok-box .tiktok-icon {
      flex-shrink: 0;
      color: var(--rosa-accent);
    }

    .instagram-box input,
    .tiktok-box input {
      border: 1.5px solid rgba(244, 143, 177, 0.4);
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 13.5px;
      font-family: 'Nunito', sans-serif;
      width: 148px;
      text-align: center;
      background: #FFFCFD;
      color: var(--texto);
      outline: none;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(236, 64, 122, 0.06);
    }

    .instagram-box input:hover,
    .tiktok-box input:hover {
      border-color: rgba(236, 64, 122, 0.55);
    }

    .instagram-box input:focus,
    .tiktok-box input:focus {
      border-color: var(--rosa-accent);
      box-shadow: 0 0 0 3px rgba(236, 64, 122, 0.12);
    }

    .instagram-box input::placeholder,
    .tiktok-box input::placeholder {
      color: #F48FB1;
      opacity: 0.7;
    }

    .qr-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .qr-box label {
      font-family: 'Fredoka', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--rosa-forte);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.85;
    }

    .qr-placeholder {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: linear-gradient(145deg, #FFF0F5, #FFE4EC);
      border: 2px solid rgba(244, 143, 177, 0.45);
      box-shadow: 0 4px 14px rgba(236, 64, 122, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      transition: all 0.25s ease;
    }

    .qr-placeholder:hover {
      border-color: var(--rosa-accent);
      box-shadow: 0 6px 18px rgba(236, 64, 122, 0.18);
      transform: translateY(-1px);
    }

    .qr-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .qr-placeholder .placeholder-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 12px;
      text-align: center;
      color: var(--rosa-forte);
      font-weight: 500;
      opacity: 0.9;
    }

    .qr-placeholder input {
      display: none;
    }

    /* ========== CONTROLES ========== */
    .controls {
      max-width: 1200px;
      margin: 24px auto 8px;
      padding: 0 20px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      animation: fadeInUp 0.5s ease-out 0.15s both;
    }

    .btn {
      font-family: 'Fredoka', sans-serif;
      font-weight: 500;
      font-size: 15px;
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(236, 64, 122, 0.15);
    }

    .btn-primary {
      background: linear-gradient(135deg, #F48FB1 0%, #EC407A 55%, #E91E63 100%);
      background-size: 200% auto;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      animation: shimmer 3.5s ease-in-out infinite;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(236, 64, 122, 0.3);
      filter: brightness(1.05);
    }

    .btn-secondary {
      background: linear-gradient(180deg, #FFFFFF, #FFF5F8);
      color: var(--rosa-accent);
      border: 1.5px solid rgba(244, 143, 177, 0.5);
      box-shadow: 0 3px 12px rgba(236, 64, 122, 0.1);
    }

    .btn-secondary:hover {
      background: linear-gradient(180deg, #FFF5F8, #FFE4EC);
      border-color: var(--rosa-forte);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(236, 64, 122, 0.15);
    }

    .btn-danger {
      background: #FFEBEE;
      color: #E53935;
      border: 2px solid #FFCDD2;
    }

    .btn-danger:hover {
      background: #FFCDD2;
    }

    .btn-print {
      background: linear-gradient(135deg, #CE93D8 0%, #AB47BC 100%);
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .btn-print:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(171, 71, 188, 0.3);
      filter: brightness(1.05);
    }

    /* ========== GRID ========== */
    .catalogo {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 280px));
      gap: 28px;
      justify-content: center;
    }

    /* ========== FRAME (moldura) ========== */
    .frame {
      width: 280px;
      height: 320px;
      max-width: 100%;
      background: linear-gradient(180deg, #FFFFFF 0%, #FFFCFD 100%);
      border-radius: 22px;
      border: 2px solid rgba(244, 143, 177, 0.4);
      box-shadow: 
        0 8px 28px rgba(236, 64, 122, 0.1),
        0 2px 8px rgba(236, 64, 122, 0.06);
      position: relative;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .frame:hover {
      transform: translateY(-5px);
      border-color: rgba(236, 64, 122, 0.55);
      box-shadow: 
        0 14px 36px rgba(236, 64, 122, 0.16),
        0 4px 12px rgba(236, 64, 122, 0.08);
    }

    .frame.empty {
      background: linear-gradient(160deg, #FFF9FB 0%, #FFE8F0 50%, #FFD6E4 100%);
      border-style: dashed;
      border-color: rgba(244, 143, 177, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      height: 320px;
    }

    .frame.empty:hover {
      background: linear-gradient(160deg, #FFF0F5 0%, #FFD6E4 50%, #FFC0D4 100%);
      border-color: var(--rosa-accent);
    }

    .frame.empty .plus-icon {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: linear-gradient(145deg, #FFFFFF, #FFF5F8);
      border: 2px solid rgba(244, 143, 177, 0.5);
      box-shadow: 0 4px 14px rgba(236, 64, 122, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: var(--rosa-accent);
      font-weight: 300;
      line-height: 1;
      transition: transform 0.2s ease;
      animation: pulseSoft 2.8s ease-in-out infinite;
    }

    .frame.empty:hover .plus-icon {
      animation: none;
      transform: scale(1.08);
    }

    .frame.empty .empty-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 15px;
      color: var(--rosa-forte);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* Área da imagem com overflow hidden */
    .frame-content {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #fafafa;
    }

    .frame-content img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      user-select: none;
      pointer-events: none;
      max-width: none;
    }

    /* Controles da moldura */
    .frame-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 10;
    }

    .frame:hover .frame-actions {
      opacity: 1;
    }

    .frame-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: transform 0.15s;
    }

    .frame-btn:hover {
      transform: scale(1.1);
    }

    .frame-btn.delete {
      color: #E53935;
    }

    .frame-btn.adjust {
      color: var(--rosa-accent);
    }

    .frame-btn.replace {
      color: #43A047;
    }

    /* Overlay de ajuste */
    .adjust-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 16px;
      z-index: 20;
      cursor: grab;
    }

    .adjust-overlay.active {
      display: flex;
    }

    .adjust-overlay:active {
      cursor: grabbing;
    }

    .adjust-controls {
      background: white;
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      width: 90%;
      max-width: 240px;
    }

    .adjust-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    .adjust-row label {
      font-size: 12px;
      font-weight: 700;
      color: var(--texto);
      min-width: 50px;
    }

    .adjust-row input[type="range"] {
      flex: 1;
      accent-color: var(--rosa-accent);
    }

    .adjust-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .adjust-btns button {
      font-family: 'Fredoka', sans-serif;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
    }

    .btn-save {
      background: var(--rosa-accent);
      color: white;
    }

    .btn-cancel {
      background: #eee;
      color: #555;
    }

    .hint {
      font-size: 11px;
      color: white;
      text-align: center;
      margin-bottom: 6px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    /* ========== FOOTER ========== */
    .footer {
      text-align: center;
      padding: 30px 20px 40px;
      font-size: 13px;
      color: var(--rosa-forte);
      opacity: 0.75;
      font-family: 'Fredoka', sans-serif;
      letter-spacing: 0.02em;
    }

    /* ========== TOAST ========== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: linear-gradient(135deg, #F48FB1, #EC407A);
      color: white;
      padding: 13px 26px;
      border-radius: 50px;
      font-family: 'Fredoka', sans-serif;
      font-size: 15px;
      box-shadow: 0 10px 28px rgba(236, 64, 122, 0.35);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 999;
      max-width: calc(100% - 32px);
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .toast.show {
      opacity: 1;

    /* ========== RESPONSIVO - TABLET ========== */
    @media (max-width: 900px) {

      .logo-placeholder {

      .logo-placeholder .placeholder-text {

      .catalogo {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;

      }

      .frame,
      .frame.empty {
        width: 100%;
        max-width: 280px;
        height: auto;
        aspect-ratio: 280 / 320;
      }

      /* Botões sempre visíveis no mobile (sem hover) */
      .frame-actions {
        opacity: 1;

      .frame-btn {

    /* ========== RESPONSIVO - CELULAR PEQUENO ========== */
    @media (max-width: 400px) {

        gap: 6px;

      }

        gap: 6px;
      }

      .catalogo {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 10px 8px 16px;
      }

      .frame,
      .frame.empty {
        max-width: 100%;
        width: 100%;
      }

      .controls {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;

    /* Melhora toque em dispositivos touch */
    @media (hover: none) and (pointer: coarse) {
      .frame-actions {
        opacity: 1;

      .frame:hover {
        transform: none;
      }

      .btn:hover {
        transform: none;
      }

      .frame-btn:hover {
        transform: none;
      }
    }

    /* Respeita preferência de reduzir movimento */
    @media (prefers-reduced-motion: reduce) {
      .cloud, .star, .heart, .unicorn, .sparkle, .bubble, .rainbow,
      .frame, .controls, .frame.empty .plus-icon, .btn-primary::after {
        animation: none !important;
      }
    }

    /* ========== IMPRESSÃO A4 ========== */
    @page {
      size: A4 portrait;
      margin: 12mm 10mm 12mm 10mm;
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }

      html, body {
        background: #FFF5F8 !important;
        background-image: none !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;

      .decorations,
      .controls,
      .footer,
      .toast,
      .frame-actions,
      .adjust-overlay,
      .frame.empty {
        display: none !important;

        border: 1px solid #F48FB1 !important;
        box-shadow: none !important;
      }

      .catalogo {
        display: grid !important;
        grid-template-columns: repeat(4, 1fr) !important;

        break-inside: avoid !important;
        page-break-inside: avoid !important;

      .frame-content {

      .frame-content img {

      }

      /* Evita quebra estranha no final da página */
      .catalogo {
        page-break-inside: auto;
      }
    }
  </style>

  <!-- CONTROLES -->
  <div class="controls">
    <button class="btn btn-primary" id="btnAdd">

    </button>

    </button>
    <button class="btn btn-print" id="btnPrint" title="Gera PDF / imprime em A4 com 4 desenhos por linha">
      <span style="font-size:16px;line-height:1">🖨</span> Imprimir catálogo
    </button>

  <!-- CATÁLOGO -->
  <main class="catalogo" id="catalogo">
    <!-- frames gerados via JS -->
  </main>

  <div class="footer">
    Toque em uma moldura vazia para adicionar um desenho • Ajuste posição e zoom • Use “Imprimir catálogo” para gerar o PDF em A4
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== ESTADO ==========
    const STORAGE_KEY = 'catalogo_desenhos_v1';
    const LOGO_VERSION = 3;

    let frames = [];
    let nextId = 1;

    // Estado de ajuste
    let adjustingId = null;
    let isDragging = false;
    let startX = 0, startY = 0;
    let startOffsetX = 0, startOffsetY = 0;

    // ========== PERSISTÊNCIA ==========
    function save() {
      const data = {
        frames,
        nextId,
        titulo: document.getElementById('tituloInput').value,
        instagram: document.getElementById('instagramInput').value,
        tiktok: document.getElementById('tiktokInput').value,
        logo: document.getElementById('logoBox').querySelector('img')?.src || null,
        logoVersion: LOGO_VERSION,
        qr: document.getElementById('qrBox').querySelector('img')?.src || null
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        showToast('Espaço de armazenamento cheio. Tente imagens menores.');
      }
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        frames = data.frames || [];
        nextId = data.nextId || 1;
        if (data.titulo) document.getElementById('tituloInput').value = data.titulo;
        if (data.instagram) document.getElementById('instagramInput').value = data.instagram;
        if (typeof data.tiktok === 'string') document.getElementById('tiktokInput').value = data.tiktok;
        if (data.logo && data.logoVersion === LOGO_VERSION) setImageInPlaceholder('logoBox', data.logo);
        if (data.qr) setImageInPlaceholder('qrBox', data.qr);
      } catch (e) {
        console.warn('Erro ao carregar dados', e);
      }
    }

    function setImageInPlaceholder(boxId, src) {
      const box = document.getElementById(boxId);
      box.innerHTML = '';
      const img = document.createElement('img');
      img.src = src;
      box.appendChild(img);
      // recria o input
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.id = boxId === 'logoBox' ? 'logoInput' : 'qrInput';
      box.appendChild(input);
      bindPlaceholder(boxId, input.id);
    }

    // ========== RENDER ==========
    function render() {
      const container = document.getElementById('catalogo');
      container.innerHTML = '';

      frames.forEach(frame => {
        const el = document.createElement('div');
        el.className = 'frame' + (frame.image ? '' : ' empty');
        el.dataset.id = frame.id;

        if (!frame.image) {
          el.innerHTML = `
            <div class="plus-icon">+</div>
            <div class="empty-text">Adicionar desenho</div>
          `;
          el.addEventListener('click', () => triggerUpload(frame.id));
        } else {
          el.innerHTML = `
            <div class="frame-content">
              <img src="${frame.image}" alt="Desenho" style="
                width: auto;
                height: auto;
                transform: translate(calc(-50% + ${frame.offsetX}px), calc(-50% + ${frame.offsetY}px)) scale(${frame.scale});
              ">
            </div>
            <div class="frame-actions">
              <button class="frame-btn adjust" title="Ajustar posição/zoom">✎</button>
              <button class="frame-btn replace" title="Trocar imagem">↺</button>
              <button class="frame-btn delete" title="Remover desenho">✕</button>
            </div>
            <div class="adjust-overlay" id="overlay-${frame.id}">
              <div class="hint">Arraste a imagem • Use o zoom</div>
              <div class="adjust-controls">
                <div class="adjust-row">
                  <label>Zoom</label>
                  <input type="range" min="0.4" max="3" step="0.05" value="${frame.scale}" class="zoom-range">
                </div>
                <div class="adjust-btns">
                  <button class="btn-cancel">Cancelar</button>
                  <button class="btn-save">Salvar</button>
                </div>
              </div>
            </div>
          `;

          // eventos
          const adjustBtn = el.querySelector('.adjust');
          const replaceBtn = el.querySelector('.replace');
          const deleteBtn = el.querySelector('.delete');
          const overlay = el.querySelector('.adjust-overlay');
          const zoomRange = el.querySelector('.zoom-range');
          const btnSave = el.querySelector('.btn-save');
          const btnCancel = el.querySelector('.btn-cancel');
          const img = el.querySelector('img');

          adjustBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startAdjust(frame.id);
          });

          replaceBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerUpload(frame.id);
          });

          deleteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm('Remover este desenho?')) {
              frame.image = null;
              frame.scale = 1;
              frame.offsetX = 0;
              frame.offsetY = 0;
              save();
              render();
              showToast('Desenho removido');
            }
          });

          // Zoom durante ajuste
          zoomRange.addEventListener('input', () => {
            frame.scale = parseFloat(zoomRange.value);
            updateImgTransform(img, frame);
          });

          btnSave.addEventListener('click', (e) => {
            e.stopPropagation();
            endAdjust(true);
          });

          btnCancel.addEventListener('click', (e) => {
            e.stopPropagation();
            endAdjust(false);
          });

          // Drag
          overlay.addEventListener('mousedown', (e) => {
            if (e.target.closest('.adjust-controls')) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startOffsetX = frame.offsetX;
            startOffsetY = frame.offsetY;
            e.preventDefault();
          });

          // Touch
          overlay.addEventListener('touchstart', (e) => {
            if (e.target.closest('.adjust-controls')) return;
            isDragging = true;
            const t = e.touches[0];
            startX = t.clientX;
            startY = t.clientY;
            startOffsetX = frame.offsetX;
            startOffsetY = frame.offsetY;
          }, { passive: true });
        }

        container.appendChild(el);
      });
    }

    function updateImgTransform(img, frame) {
      img.style.transform = `translate(calc(-50% + ${frame.offsetX}px), calc(-50% + ${frame.offsetY}px)) scale(${frame.scale})`;
    }

    // ========== AJUSTE ==========
    let backupFrame = null;

    function startAdjust(id) {
      adjustingId = id;
      const frame = frames.find(f => f.id === id);
      backupFrame = { ...frame };

      const overlay = document.getElementById(`overlay-${id}`);
      if (overlay) overlay.classList.add('active');
    }

    function endAdjust(saveChanges) {
      if (!adjustingId) return;
      const frame = frames.find(f => f.id === adjustingId);

      if (!saveChanges && backupFrame) {
        Object.assign(frame, backupFrame);
      }

      const overlay = document.getElementById(`overlay-${adjustingId}`);
      if (overlay) overlay.classList.remove('active');

      adjustingId = null;
      backupFrame = null;
      isDragging = false;
      save();
      render();
      if (saveChanges) showToast('Ajuste salvo!');
    }

    // Listeners globais de drag
    document.addEventListener('mousemove', (e) => {
      if (!isDragging || !adjustingId) return;
      const frame = frames.find(f => f.id === adjustingId);
      if (!frame) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      frame.offsetX = startOffsetX + dx;
      frame.offsetY = startOffsetY + dy;

      const img = document.querySelector(`.frame[data-id="${adjustingId}"] img`);
      if (img) updateImgTransform(img, frame);
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    document.addEventListener('touchmove', (e) => {
      if (!isDragging || !adjustingId) return;
      const frame = frames.find(f => f.id === adjustingId);
      if (!frame) return;
      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      frame.offsetX = startOffsetX + dx;
      frame.offsetY = startOffsetY + dy;

      const img = document.querySelector(`.frame[data-id="${adjustingId}"] img`);
      if (img) updateImgTransform(img, frame);
    }, { passive: true });

    document.addEventListener('touchend', () => {
      isDragging = false;
    });

    // ========== UPLOAD ==========
    function triggerUpload(frameId) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const frame = frames.find(f => f.id === frameId);
          if (frame) {
            frame.image = ev.target.result;
            frame.scale = 1;
            frame.offsetX = 0;
            frame.offsetY = 0;
            save();
            render();
            showToast('Desenho adicionado!');
            // Abre automaticamente o modo de ajuste
            setTimeout(() => startAdjust(frameId), 100);
          }
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }

    // ========== PLACEHOLDERS (logo / QR) ==========
    function bindPlaceholder(boxId, inputId) {
      const box = document.getElementById(boxId);
      const input = document.getElementById(inputId);
      if (!box || !input) return;

      box.onclick = () => input.click();
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          box.innerHTML = '';
          const img = document.createElement('img');
          img.src = ev.target.result;
          box.appendChild(img);
          // recria input
          const newInput = document.createElement('input');
          newInput.type = 'file';
          newInput.accept = 'image/*';
          newInput.id = inputId;
          box.appendChild(newInput);
          bindPlaceholder(boxId, inputId);
          save();
        };
        reader.readAsDataURL(file);
      };
    }

    // ========== AÇÕES ==========
    document.getElementById('btnAdd').addEventListener('click', () => {
      frames.push({
        id: nextId++,
        image: null,
        scale: 1,
        offsetX: 0,
        offsetY: 0
      });
      save();
      render();
      showToast('Nova moldura adicionada');
    });

    document.getElementById('btnClearEmpty').addEventListener('click', () => {
      const before = frames.length;
      frames = frames.filter(f => f.image);
      if (frames.length < before) {
        save();
        render();
        showToast('Molduras vazias removidas');
      } else {
        showToast('Nenhuma moldura vazia');
      }
    });

    document.getElementById('btnPrint').addEventListener('click', () => {
      const withImages = frames.filter(f => f.image);
      if (withImages.length === 0) {
        showToast('Adicione pelo menos um desenho para imprimir');
        return;
      }
      // Garante que só os com imagem apareçam (já ocultamos .empty no CSS de print)
      showToast('Abrindo impressão… escolha “Salvar como PDF”');
      setTimeout(() => {
        window.print();
      }, 400);
    });

    // Salvar título e redes sociais
    document.getElementById('tituloInput').addEventListener('change', save);
    document.getElementById('instagramInput').addEventListener('change', save);
    document.getElementById('tiktokInput').addEventListener('change', save);

    // ========== TOAST ==========
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ========== INICIALIZAÇÃO ==========
    load();

    // Se não tiver nenhuma moldura, cria 6 iniciais
    if (frames.length === 0) {
      for (let i = 0; i < 6; i++) {
        frames.push({
          id: nextId++,
          image: null,
          scale: 1,
          offsetX: 0,
          offsetY: 0
        });
      }
      save();
    }

    render();
    bindPlaceholder('logoBox', 'logoInput');
    bindPlaceholder('qrBox', 'qrInput');
  </script>
</body>
</html>
