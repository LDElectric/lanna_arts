  <style>
    :root {
      --rosa-claro: #FFE4EC;
      --rosa-medio: #FFB6C1;
      --rosa-forte: #F48FB1;
      --rosa-accent: #EC407A;
      --rosa-suave: #FCE4EC;
      --branco: #FFFFFF;
      --creme: #FFF8FA;
      --texto: #6D5A6E;
      --sombra: rgba(236, 64, 122, 0.12);
      --borda: #F8BBD0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: 
        radial-gradient(ellipse 120% 80% at 10% 20%, rgba(255, 182, 193, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse 100% 60% at 90% 10%, rgba(255, 192, 203, 0.3) 0%, transparent 45%),
        radial-gradient(ellipse 80% 50% at 70% 80%, rgba(255, 228, 236, 0.5) 0%, transparent 50%),
        radial-gradient(ellipse 90% 70% at 20% 90%, rgba(255, 240, 245, 0.6) 0%, transparent 45%),
        linear-gradient(165deg, #FFF5F8 0%, #FFE8F0 35%, #FFF0F5 65%, #FFFFFF 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--texto);
      line-height: 1.5;
      position: relative;
      overflow-x: hidden;
    }

    /* ========== DECORAÇÕES DE FUNDO ========== */
    .decorations {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 100px;
      filter: blur(1px);
      opacity: 0.85;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud-1 {
      width: 180px;
      height: 50px;
      top: 12%;
      left: 5%;
      animation: float 22s ease-in-out infinite;
    }
    .cloud-1::before {
      width: 70px;
      height: 70px;
      top: -35px;
      left: 25px;
    }
    .cloud-1::after {
      width: 55px;
      height: 55px;
      top: -25px;
      left: 85px;
    }

    .cloud-2 {
      width: 140px;
      height: 40px;
      top: 28%;
      right: 8%;
      animation: float 18s ease-in-out infinite reverse;
      animation-delay: -5s;
    }
    .cloud-2::before {
      width: 55px;
      height: 55px;
      top: -28px;
      left: 20px;
    }
    .cloud-2::after {
      width: 45px;
      height: 45px;
      top: -20px;
      left: 65px;
    }

    .cloud-3 {
      width: 160px;
      height: 45px;
      bottom: 18%;
      left: 12%;
      animation: float 25s ease-in-out infinite;
      animation-delay: -10s;
      opacity: 0.65;
    }
    .cloud-3::before {
      width: 60px;
      height: 60px;
      top: -30px;
      left: 22px;
    }
    .cloud-3::after {
      width: 50px;
      height: 50px;
      top: -22px;
      left: 75px;
    }

    .cloud-4 {
      width: 120px;
      height: 36px;
      bottom: 35%;
      right: 15%;
      animation: float 20s ease-in-out infinite reverse;
      animation-delay: -3s;
      opacity: 0.7;
    }
    .cloud-4::before {
      width: 48px;
      height: 48px;
      top: -24px;
      left: 18px;
    }
    .cloud-4::after {
      width: 40px;
      height: 40px;
      top: -18px;
      left: 55px;
    }

    .star {
      position: absolute;
      color: #F8BBD0;
      font-size: 18px;
      opacity: 0.55;
      animation: twinkle 3.5s ease-in-out infinite;
    }

    .star:nth-child(odd) {
      animation-delay: 1.2s;
    }

    .heart {
      position: absolute;
      color: #F48FB1;
      font-size: 14px;
      opacity: 0.4;
      animation: float 12s ease-in-out infinite;
    }

    .unicorn {
      position: absolute;
      font-size: 28px;
      opacity: 0.35;
      filter: grayscale(0.1);
      animation: float 16s ease-in-out infinite;
    }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle, #fff 20%, #F8BBD0 70%, transparent 100%);
      border-radius: 50%;
      opacity: 0;
      animation: sparkle 4s ease-in-out infinite;
    }

    .rainbow {
      position: absolute;
      width: 120px;
      height: 60px;
      border-radius: 120px 120px 0 0;
      border: 6px solid transparent;
      border-top-color: rgba(255, 182, 193, 0.35);
      border-left-color: rgba(255, 223, 186, 0.25);
      border-right-color: rgba(186, 225, 255, 0.25);
      opacity: 0.5;
      animation: float 20s ease-in-out infinite;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,182,193,0.25));
      border: 1px solid rgba(255,255,255,0.5);
      opacity: 0.4;
      animation: bubbleRise 14s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); }
      33% { transform: translateY(-14px) translateX(6px) rotate(1deg); }
      66% { transform: translateY(-8px) translateX(-5px) rotate(-1deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1) rotate(0deg); }
      50% { opacity: 0.85; transform: scale(1.25) rotate(12deg); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.4); }
      40% { opacity: 0.9; transform: scale(1.2); }
      70% { opacity: 0.4; transform: scale(0.8); }
    }

    @keyframes bubbleRise {
      0% { transform: translateY(0) scale(1); opacity: 0.35; }
      50% { transform: translateY(-40px) scale(1.1); opacity: 0.55; }
      100% { transform: translateY(-80px) scale(0.9); opacity: 0.15; }
    }

    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 14px rgba(236, 64, 122, 0.12); }
      50% { transform: scale(1.06); box-shadow: 0 6px 18px rgba(236, 64, 122, 0.2); }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 150%; }
    }

    /* Conteúdo acima das decorações */
    .header,
    .controls,
    .catalogo,
    .footer {
      position: relative;
      z-index: 1;
    }

    /* Animação de entrada das molduras */
    .frame {
      animation: fadeInUp 0.55s ease-out both;
    }

    .frame:nth-child(1) { animation-delay: 0.05s; }
    .frame:nth-child(2) { animation-delay: 0.1s; }
    .frame:nth-child(3) { animation-delay: 0.15s; }
    .frame:nth-child(4) { animation-delay: 0.2s; }
    .frame:nth-child(5) { animation-delay: 0.25s; }
    .frame:nth-child(6) { animation-delay: 0.3s; }
    .frame:nth-child(7) { animation-delay: 0.35s; }
    .frame:nth-child(8) { animation-delay: 0.4s; }
    .frame:nth-child(n+9) { animation-delay: 0.45s; }

    .frame.empty .plus-icon {
      animation: pulseSoft 2.8s ease-in-out infinite;
    }

    /* ========== HEADER ========== */
    .header {
      background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,249,251,0.88) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: none;
      box-shadow: 0 8px 32px rgba(236, 64, 122, 0.07);
      padding: 18px 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 90px;
    }

    .logo-placeholder {
      width: 112px;
      height: 112px;
      background: transparent;
      border: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
      overflow: hidden;
      position: relative;
    }

    .logo-placeholder:hover {
      opacity: 0.9;
    }

    .logo-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-placeholder .placeholder-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 12px;
      text-align: center;
      color: var(--rosa-forte);
      font-weight: 500;
      padding: 6px;
      line-height: 1.25;
      opacity: 0.9;
    }

    .logo-placeholder input {
      display: none;
    }

    .titulo {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 1.85rem;
      color: var(--rosa-accent);
      text-align: center;
      flex: 1;
      min-width: 220px;
      letter-spacing: -0.02em;
    }

    .titulo input {
      font-family: inherit;
      font-weight: inherit;
      font-size: inherit;
      color: inherit;
      border: none;
      background: transparent;
      text-align: center;
      width: 100%;
      outline: none;
      border-bottom: 2px solid transparent;
      padding-bottom: 2px;
      transition: border-color 0.25s ease;
    }

    .titulo input:hover,
    .titulo input:focus {
      border-bottom-color: rgba(236, 64, 122, 0.35);
    }

    .titulo input::placeholder {
      color: #F8BBD0;
      opacity: 0.8;
    }

    .social-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .print-title-badge,
    .print-site-badge {
      display: none;
    }

    .instagram-box,
    .tiktok-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .social-qr-link {
      display: none;
    }

    .social-label-link:focus-visible {
      outline: 2px solid var(--rosa-accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .social-label-link {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #8D3154;
      text-decoration: none;
      white-space: nowrap;
      min-height: 36px;
    }

    .social-label-link:hover {
      color: var(--rosa-accent);
      text-decoration: underline;
    }

    .social-label-link svg,
    .social-label-link .tiktok-icon {
      flex-shrink: 0;
      color: #B82E66;
    }

    .social-label-link svg {
      width: 18px;
      height: 18px;
    }

    .social-label-link .tiktok-icon {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      font-size: 20px;
      line-height: 1;
    }

    .qr-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .pix-label {
      font-family: 'Fredoka', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--rosa-forte);
      text-transform: uppercase;
    }

    .pix-print-frame {
      width: 84px;
      height: 84px;
      padding: 4px;
      border: 1px solid rgba(244, 143, 177, 0.6);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 3px 12px rgba(100, 54, 68, 0.12);
      overflow: hidden;
    }

    .pix-print-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ========== CONTROLES ========== */
    .controls {
      max-width: 1200px;
      margin: 24px auto 8px;
      padding: 0 20px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      animation: fadeInUp 0.5s ease-out 0.15s both;
    }

    .btn {
      font-family: 'Fredoka', sans-serif;
      font-weight: 500;
      font-size: 15px;
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(236, 64, 122, 0.15);
    }

    .btn-primary {
      background: linear-gradient(135deg, #F48FB1 0%, #EC407A 55%, #E91E63 100%);
      background-size: 200% auto;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      animation: shimmer 3.5s ease-in-out infinite;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(236, 64, 122, 0.3);
      filter: brightness(1.05);
    }

    .btn-secondary {
      background: linear-gradient(180deg, #FFFFFF, #FFF5F8);
      color: var(--rosa-accent);
      border: 1.5px solid rgba(244, 143, 177, 0.5);
      box-shadow: 0 3px 12px rgba(236, 64, 122, 0.1);
    }

    .btn-secondary:hover {
      background: linear-gradient(180deg, #FFF5F8, #FFE4EC);
      border-color: var(--rosa-forte);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(236, 64, 122, 0.15);
    }

    .btn-danger {
      background: #FFEBEE;
      color: #E53935;
      border: 2px solid #FFCDD2;
    }

    .btn-danger:hover {
      background: #FFCDD2;
    }

    .btn-print {
      background: linear-gradient(135deg, #CE93D8 0%, #AB47BC 100%);
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .btn-print:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(171, 71, 188, 0.3);
      filter: brightness(1.05);
    }

    /* ========== GRID ========== */
    .catalogo {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 280px));
      gap: 28px;
      justify-content: center;
    }

    /* ========== FRAME (moldura) ========== */
    .frame {
      width: 280px;
      height: 320px;
      max-width: 100%;
      background: linear-gradient(180deg, #FFFFFF 0%, #FFFCFD 100%);
      border-radius: 22px;
      border: 2px solid rgba(244, 143, 177, 0.4);
      box-shadow: 
        0 8px 28px rgba(236, 64, 122, 0.1),
        0 2px 8px rgba(236, 64, 122, 0.06);
      position: relative;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .frame:hover {
      transform: translateY(-5px);
      border-color: rgba(236, 64, 122, 0.55);
      box-shadow: 
        0 14px 36px rgba(236, 64, 122, 0.16),
        0 4px 12px rgba(236, 64, 122, 0.08);
    }

    .frame.empty {
      background: linear-gradient(160deg, #FFF9FB 0%, #FFE8F0 50%, #FFD6E4 100%);
      border-style: dashed;
      border-color: rgba(244, 143, 177, 0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      height: 320px;
    }

    .frame.empty:hover {
      background: linear-gradient(160deg, #FFF0F5 0%, #FFD6E4 50%, #FFC0D4 100%);
      border-color: var(--rosa-accent);
    }

    .frame.empty .plus-icon {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: linear-gradient(145deg, #FFFFFF, #FFF5F8);
      border: 2px solid rgba(244, 143, 177, 0.5);
      box-shadow: 0 4px 14px rgba(236, 64, 122, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: var(--rosa-accent);
      font-weight: 300;
      line-height: 1;
      transition: transform 0.2s ease;
      animation: pulseSoft 2.8s ease-in-out infinite;
    }

    .frame.empty:hover .plus-icon {
      animation: none;
      transform: scale(1.08);
    }

    .frame.empty .empty-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 15px;
      color: var(--rosa-forte);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* Área da imagem com overflow hidden */
    .frame-content {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #fafafa;
      cursor: zoom-in;
    }

    .frame-content img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      user-select: none;
      pointer-events: none;
      max-width: none;
    }

    .frame-content:focus-visible {
      outline: 3px solid var(--rosa-accent);
      outline-offset: -5px;
    }

    /* Controles da moldura */
    .frame-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 10;
    }

    .frame:hover .frame-actions {
      opacity: 1;
    }

    .frame-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: transform 0.15s;
    }

    .frame-btn:hover {
      transform: scale(1.1);
    }

    .frame-btn.delete {
      color: #E53935;
    }

    .frame-btn.adjust {
      color: var(--rosa-accent);
    }

    .frame-btn.replace {
      color: #43A047;
    }

    .image-editor-backdrop {
      position: fixed;
      inset: 0;
      z-index: 400;
      display: grid;
      place-items: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      background: rgba(39, 24, 31, 0.72);
      backdrop-filter: blur(5px);
    }

    .image-editor-card {
      width: min(920px, 100%);
      height: min(92dvh, 900px);
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: clamp(14px, 2.4vw, 24px);
      border: 1px solid #F8BBD0;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 24px 80px rgba(24, 12, 18, 0.36);
    }

    .image-editor-card:not(.is-editing) {
      height: auto;
      max-height: 90dvh;
    }

    .image-editor-header,
    .image-editor-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .image-editor-header h2 {
      margin: 0;
      color: var(--rosa-forte);
      font: 600 1.15rem 'Fredoka', sans-serif;
    }

    .image-editor-close {
      flex: 0 0 auto;
      min-width: 44px;
      min-height: 44px;
      border: 0;
      border-radius: 50%;
      background: #FFF0F5;
      color: #7A3651;
      font-size: 24px;
      cursor: pointer;
    }

    .image-editor-stage {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 12px;
      border: 1px solid #F2E5EA;
      border-radius: 16px;
      background:
        radial-gradient(circle at 1px 1px, rgba(122, 54, 81, 0.09) 1px, transparent 0) 0 0 / 18px 18px,
        #FAF7F8;
    }

    .image-editor-frame {
      position: relative;
      width: min(100%, 45dvh);
      height: auto;
      max-height: 100%;
      aspect-ratio: 280 / 320;
      overflow: hidden;
      border: 2px solid rgba(244, 143, 177, 0.72);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 34px rgba(77, 42, 56, 0.18);
    }

    .image-editor-frame .frame-content {
      cursor: zoom-in;
      touch-action: manipulation;
    }

    .image-editor-card.is-editing .image-editor-frame .frame-content {
      cursor: grab;
      touch-action: none;
    }

    .image-editor-frame .frame-content:active {
      cursor: grabbing;
    }

    .image-editor-hint {
      margin: 0;
      color: #705563;
      font-size: 13px;
      text-align: center;
    }

    .image-editor-tools {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .image-editor-zoom {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) 54px auto;
      align-items: center;
      gap: 12px;
      color: #593747;
      font-size: 14px;
      font-weight: 700;
    }

    .image-editor-zoom input {
      width: 100%;
      accent-color: var(--rosa-accent);
    }

    .image-editor-zoom output {
      min-width: 48px;
      color: #7A3651;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .image-editor-actions {
      justify-content: flex-end;
    }

    .image-editor-actions .btn {
      min-height: 44px;
    }

    .image-editor-card:not(.is-editing) .image-editor-tools {
      display: none;
    }

    .image-editor-card:not(.is-editing) .image-editor-actions {
      display: none;
    }

    /* ========== FOOTER ========== */
    .footer {
      text-align: center;
      padding: 30px 20px 40px;
      font-size: 13px;
      color: var(--rosa-forte);
      opacity: 0.75;
      font-family: 'Fredoka', sans-serif;
      letter-spacing: 0.02em;
    }

    /* ========== TOAST ========== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: linear-gradient(135deg, #F48FB1, #EC407A);
      color: white;
      padding: 13px 26px;
      border-radius: 50px;
      font-family: 'Fredoka', sans-serif;
      font-size: 15px;
      box-shadow: 0 10px 28px rgba(236, 64, 122, 0.35);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 999;
      max-width: calc(100% - 32px);
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ========== RESPONSIVO - TABLET ========== */
    @media (max-width: 900px) {
      .header {
        padding: 14px 18px;
      }

      .header-inner {
        gap: 16px;
      }

      .logo-placeholder {
        width: 88px;
        height: 88px;
        border-radius: 18px;
      }

      .titulo {
        font-size: 1.55rem;
      }

      .social-area {
        gap: 12px;
      }

      .social-label-link {
        font-size: 13px;
      }

      .catalogo {
        gap: 22px;
        padding: 18px 16px;
      }

      .catalogo {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        justify-content: stretch;
      }

      .frame,
      .frame.empty {
        width: 100%;
        height: auto;
        aspect-ratio: 280 / 320;
      }

      .controls {
        padding: 0 16px;
        margin-top: 18px;
      }
    }

    /* ========== RESPONSIVO - MOBILE ========== */
    @media (max-width: 640px) {
      .header {
        padding: 8px 12px;
      }

      .header-inner {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr) 36px;
        grid-template-rows: auto auto;
        gap: 4px 8px;
        align-items: center;
      }

      .logo-area {
        grid-column: 1;
        grid-row: 1;
        min-width: auto;
      }

      .titulo {
        grid-column: 2;
        grid-row: 1;
        font-size: clamp(0.95rem, 4vw, 1.2rem);
        min-width: 0;
        text-align: center;
      }

      .social-area {
        grid-column: 1 / -1;
        grid-row: 2;
        width: 100%;
        justify-content: center;
        gap: clamp(12px, 6vw, 28px);
      }

      .social-label-link {
        font-size: 12px;
        gap: 5px;
      }

      .social-label-link svg,
      .social-label-link .tiktok-icon {
        width: 16px;
        height: 16px;
      }

      .logo-placeholder {
        width: 54px;
        height: 60px;
      }

      #adminButton {
        grid-column: 3;
        grid-row: 1;
        width: 36px;
        height: 36px;
        padding: 0;
        overflow: hidden;
        font-size: 0;
      }

      #adminButton::before {
        content: "⚙";
        font-size: 19px;
      }

      .controls {
        margin: 12px auto 4px;
        padding: 0 10px;
        gap: 8px;
      }

      .btn {
        font-size: 13px;
        padding: 10px 14px;
      }

      .catalogo {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 12px 10px 18px;
        justify-items: center;
      }

      .frame,
      .frame.empty {
        width: 100%;
        max-width: 280px;
        height: auto;
        aspect-ratio: 280 / 320;
      }

      /* Botões sempre visíveis no mobile (sem hover) */
      .frame-actions {
        opacity: 1;
        top: 6px;
        right: 6px;
      }

      .frame-btn {
        width: 34px;
        height: 34px;
        font-size: 15px;
      }

      .frame.empty .plus-icon {
        width: 48px;
        height: 48px;
        font-size: 28px;
      }

      .frame.empty .empty-text {
        font-size: 13px;
      }

      .footer {
        padding: 20px 14px 32px;
        font-size: 11px;
        line-height: 1.4;
      }
    }

    /* ========== RESPONSIVO - CELULAR PEQUENO ========== */
    @media (max-width: 400px) {
      .header {
        padding: 6px 8px;
      }

      .header-inner {
        grid-template-columns: 48px minmax(0, 1fr) 34px;
        gap: 5px 6px;
      }

      .titulo {
        font-size: 0.92rem;
      }

      .social-area {
        gap: 18px;
      }

      .logo-placeholder {
        width: 46px;
        height: 54px;
      }

      .social-label-link {
        font-size: 12px;
      }

      #adminButton {
        width: 34px;
        height: 34px;
      }

      .catalogo {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 10px 8px 16px;
      }

      .frame,
      .frame.empty {
        max-width: 100%;
        width: 100%;
      }

      .controls {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }

      .btn {
        justify-content: center;
        flex: 1 1 auto;
        min-width: 0;
        padding: 9px 10px;
        font-size: 12px;
      }
    }

    /* Melhora toque em dispositivos touch */
    @media (hover: none) and (pointer: coarse) {
      .frame-actions {
        opacity: 1;
      }

      .frame:hover {
        transform: none;
      }

      .btn:hover {
        transform: none;
      }

      .frame-btn:hover {
        transform: none;
      }
    }

    /* Respeita preferência de reduzir movimento */
    @media (prefers-reduced-motion: reduce) {
      .cloud, .star, .heart, .unicorn, .sparkle, .bubble, .rainbow,
      .frame, .controls, .frame.empty .plus-icon, .btn-primary::after {
        animation: none !important;
      }
    }

    /* ========== IMPRESSÃO A4 ========== */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }

      html, body {
        background: 
          radial-gradient(ellipse 120% 80% at 10% 20%, rgba(255, 182, 193, 0.35) 0%, transparent 50%),
          radial-gradient(ellipse 100% 60% at 90% 10%, rgba(255, 192, 203, 0.3) 0%, transparent 45%),
          radial-gradient(ellipse 80% 50% at 70% 80%, rgba(255, 228, 236, 0.5) 0%, transparent 50%),
          radial-gradient(ellipse 90% 70% at 20% 90%, rgba(255, 240, 245, 0.6) 0%, transparent 45%),
          linear-gradient(165deg, #FFF5F8 0%, #FFE8F0 35%, #FFF0F5 65%, #FFFFFF 100%) !important;
        background-color: #FFF5F8 !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        min-height: 100% !important;
        height: auto !important;
        overflow: visible !important;
      }

      body {
        padding: 6mm 8mm !important;
        box-sizing: border-box !important;
      }

      body:not(.has-print-qr) > * {
        display: none !important;
      }

      .decorations,
      .controls,
      .footer,
      .toast,
      .frame-actions,
      .frame.empty,
      .admin-trigger,
      .admin-backdrop,
      .image-editor-backdrop,
      .social-label-link,
      .titulo {
        display: none !important;
      }

      .header {
        position: static !important;
        background: rgba(255, 255, 255, 0.9) !important;
        border: 0.4mm solid #F8BBD0 !important;
        border-radius: 3.5mm !important;
        box-shadow: 0 1mm 2.5mm rgba(244, 143, 177, 0.12) !important;
        padding: 2mm 3.5mm !important;
        margin-bottom: 3.5mm !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      .header-inner {
        display: flex !important;
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        align-items: center !important;
        justify-content: space-between !important;
        width: 100% !important;
        min-height: auto !important;
        gap: 2mm !important;
      }

      .logo-area {
        flex: 0 0 auto !important;
        display: flex !important;
        align-items: center !important;
        justify-content: flex-start !important;
        min-width: 0 !important;
      }

      .logo-placeholder {
        width: 22mm !important;
        height: 22mm !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 0 !important;
      }

      .logo-placeholder img {
        width: 100% !important;
        height: 100% !important;

      }

      .print-title-badge {
        flex: 0 0 auto !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 1.5mm !important;
        padding: 1.6mm 3.5mm !important;
        background: linear-gradient(135deg, #FFF5F8 0%, #FFEBF2 100%) !important;
        border: 0.4mm solid #F48FB1 !important;
        border-radius: 3mm !important;
        box-shadow: 0 0.8mm 2mm rgba(244, 143, 177, 0.18) !important;
        margin: 0 !important;
      }

      .print-title-text {
        font-family: 'Fredoka', 'Nunito', sans-serif !important;
        font-size: 11pt !important;
        font-weight: 700 !important;
        color: #9C2756 !important;
        letter-spacing: 0.3px !important;
        text-transform: uppercase !important;
        white-space: nowrap !important;
      }

      .print-sparkle {
        color: #E91E63 !important;
        font-size: 10.5pt !important;
        line-height: 1 !important;
      }

      .social-area {
        flex: 0 0 auto !important;
        display: flex !important;
        flex-direction: row !important;
        flex-wrap: nowrap !important;
        justify-content: flex-end !important;
        align-items: center !important;
        gap: 1.8mm !important;
        max-width: none !important;
      }

      .print-site-badge {
        display: inline-flex !important;
        flex: 0 0 auto !important;
        width: auto !important;
        align-items: center !important;
        gap: 1mm !important;
        font-family: 'Fredoka', 'Nunito', sans-serif !important;
        font-size: 6.5pt !important;
        font-weight: 700 !important;
        color: #8D3154 !important;
        background: #FFF0F5 !important;
        border: 0.3mm solid #F8BBD0 !important;
        border-radius: 2mm !important;
        padding: 1.2mm 2.2mm !important;
        text-decoration: none !important;
        white-space: nowrap !important;
      }

      .print-site-badge svg {
        color: #C2185B !important;
      }

      .instagram-box,
      .tiktok-box {
        display: flex !important;

        align-items: center !important;
        flex: 0 0 auto !important;
      }

      .social-qr-link {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 0.3mm !important;
        width: 14mm !important;
        height: auto !important;
        padding: 0.6mm !important;
        border: 0.3mm solid #F48FB1 !important;
        border-radius: 1.8mm !important;
        box-shadow: 0 0.5mm 1.5mm rgba(244, 143, 177, 0.15) !important;
        background: #FFFFFF !important;
        text-decoration: none !important;
        flex: 0 0 auto !important;
      }

      .social-qr {
        display: block !important;
        width: 12mm !important;
        height: 12mm !important;
        object-fit: contain !important;
      }

      .print-qr-label {
        display: block !important;
        color: #7A3651 !important;
        font-family: 'Nunito', sans-serif !important;
        font-size: 4.8pt !important;
        font-weight: 700 !important;
        line-height: 1.1 !important;
        max-width: 13.5mm !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        white-space: nowrap !important;
        text-align: center !important;
      }

      #qrPrintBox {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 0.3mm !important;
        flex: 0 0 auto !important;
      }

      #qrPrintBox:not(.has-pix) {
        display: none !important;
      }

      .pix-label {
        font-family: 'Fredoka', 'Nunito', sans-serif !important;
        font-size: 5pt !important;
        font-weight: 700 !important;
        color: #7A3651 !important;
        line-height: 1 !important;
      }

      .pix-print-frame {
        width: 14mm !important;
        height: 14mm !important;
        padding: 0.6mm !important;
        border: 0.3mm solid #F48FB1 !important;
        border-radius: 1.8mm !important;
        box-shadow: 0 0.5mm 1.5mm rgba(244, 143, 177, 0.15) !important;
        background: #FFFFFF !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-sizing: border-box !important;
      }

      #qrPrintImage {
        display: block !important;
        width: 12mm !important;
        height: 12mm !important;
        object-fit: contain !important;
      }

      .catalogo {
        display: grid !important;
        grid-template-columns: repeat(4, 1fr) !important;
        gap: 4mm 3.5mm !important;
        padding: 0 !important;
        max-width: 100% !important;
        margin: 0 !important;
        justify-content: stretch !important;
        justify-items: stretch !important;
        page-break-inside: auto !important;
        break-after: avoid !important;
        page-break-after: avoid !important;
      }

      .frame {
        width: 100% !important;
        max-width: none !important;
        height: auto !important;
        aspect-ratio: 280 / 320 !important;
        background: linear-gradient(180deg, #FFFFFF 0%, #FFFCFD 100%) !important;
        border: 1pt solid #F48FB1 !important;
        border-radius: 3.5mm !important;
        box-shadow: 0 1mm 2.5mm rgba(236, 64, 122, 0.1) !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        animation: none !important;
        transform: none !important;
        overflow: hidden !important;
      }

      .frame-content {
        width: 100% !important;
        height: 100% !important;
        position: relative !important;
        overflow: hidden !important;
        background: #FFFFFF !important;
        border-radius: 3.2mm !important;
      }

      .frame-content img {
        position: absolute !important;
        max-width: none !important;
        transform-origin: center center !important;
      }
    }

    [hidden] {
      display: none !important;
    }

    .titulo h1 {
      margin: 0;
      font: inherit;
    }

    .print-qr-label {
      display: none;
    }

    .admin-backdrop {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(63, 35, 48, 0.46);
    }

    .admin-card {
      width: min(100%, 440px);
      max-height: min(90vh, 760px);
      overflow: auto;
      padding: 24px;
      border: 1px solid #F8BBD0;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(86, 35, 57, 0.24);
    }

    .admin-card h2 {
      margin: 0 0 18px;
      color: var(--rosa-accent);
      font-family: 'Fredoka', sans-serif;
    }

    .admin-card label {
      display: grid;
      gap: 6px;
      margin: 12px 0;
      color: var(--texto);
      font-weight: 700;
    }

    .admin-card input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #E8B7C7;
      border-radius: 10px;
      font: inherit;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .admin-actions .btn {
      cursor: pointer;
    }

    .admin-status {
      min-height: 1.5em;
      color: #A22B57;
    }

    .admin-trigger {
      padding: 8px 12px;
      border: 1px solid #F1B5C9;
      border-radius: 12px;
      background: #fff;
      color: var(--rosa-accent);
      font: inherit;
      cursor: pointer;
    }

    @media (max-width: 640px) {
      .image-editor-backdrop {
        padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
          max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      }

      .image-editor-card {
        width: 100%;
        height: min(94dvh, 900px);
        gap: 10px;
        padding: 12px;
        border-radius: 16px;
      }

      .image-editor-stage {
        padding: 8px;
        border-radius: 12px;
      }

      .image-editor-frame {
        max-height: 100%;
        border-radius: 14px;
      }

      .image-editor-hint {
        font-size: 12px;
      }

      .image-editor-zoom {
        grid-template-columns: auto minmax(0, 1fr) 44px auto;
        gap: 8px;
        font-size: 13px;
      }

      .image-editor-zoom button {
        min-width: 42px;
        min-height: 42px;
      }

      .image-editor-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .image-editor-actions .btn {
        width: 100%;
        justify-content: center;
        padding: 10px 12px;
      }
    }

    @media (max-width: 640px) and (max-height: 520px) {
      .image-editor-card {
        height: min(96dvh, 500px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(155px, 30vw);
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        gap: 8px;
        padding: 8px;
      }

      .image-editor-header {
        grid-column: 1 / -1;
        grid-row: 1;
      }

      .image-editor-stage {
        grid-column: 1;
        grid-row: 2 / 5;
        min-height: 0;
        padding: 4px;
      }

      .image-editor-frame {
        width: auto;
        height: 100%;
        max-height: 100%;
        max-width: 100%;
      }

      .image-editor-hint {
        grid-column: 2;
        grid-row: 2;
        align-self: end;
      }

      .image-editor-tools {
        grid-column: 2;
        grid-row: 3;
        align-self: center;
      }

      .image-editor-zoom {
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
      }

      .image-editor-zoom output {
        text-align: left;
      }

      .image-editor-actions {
        grid-column: 2;
        grid-row: 4;
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
      }

      .image-editor-actions .btn {
        padding: 8px;
      }
    }

    @media print {
      .admin-backdrop {
        display: none !important;
      }
    }
  </style>
</head>

      <!-- Título -->
      <div class="titulo">
        <h1 id="tituloDisplay">Catálogo de Desenhos</h1>
      </div>
      <div class="print-title-badge" aria-hidden="true">
        <span class="print-sparkle">✨</span>
        <span class="print-title-text">Escolha seu Desenho</span>
        <span class="print-sparkle">✨</span>
      </div>

      <!-- Redes sociais + QR -->
      <div class="social-area">
        <a class="print-site-badge" href="https://lanna-arts.pages.dev/" target="_blank" rel="noopener noreferrer">

          <a class="social-label-link" id="instagramProfileLink" href="https://www.instagram.com/Lanna.artees/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">

          <a class="social-label-link" id="tiktokProfileLink" href="https://www.tiktok.com/@lanna.lopess" target="_blank" rel="noopener noreferrer">
            <span class="tiktok-icon" aria-hidden="true">♪</span>
            <span id="tiktokName">@lanna.lopess</span>
          </a>
          <a class="social-qr-link" id="tiktokQrLink" href="https://www.tiktok.com/@lanna.lopess" target="_blank" rel="noopener noreferrer" aria-label="QR Code do TikTok @lanna.lopess">

        <button class="admin-trigger" id="adminButton" type="button" aria-label="Área administrativa da Lanna">Área da Lanna</button>
      </div>
      <!-- QR Pix separado na extremidade direita -->
      <div class="qr-box" id="qrPrintBox" aria-hidden="true">
        <div class="pix-print-frame">
          <img id="qrPrintImage" alt="">
        </div>
        <span class="pix-label">Pix</span>
      </div>
    </div>
  </header>

  <!-- CONTROLES -->
  <div class="controls">
    <button class="btn btn-primary" id="btnAdd" hidden>
      <span style="font-size:20px;line-height:1">+</span> Adicionar moldura
    </button>
    <button class="btn btn-print" id="btnPrint" title="Imprime o catálogo com o QR de impressão" hidden>
      <span style="font-size:16px;line-height:1">🖨</span> Imprimir catálogo
    </button>
  </div>

  <!-- CATÁLOGO -->
  <main class="catalogo" id="catalogo">
    <!-- frames gerados via JS -->
  </main>

  <div class="footer">
    Siga os perfis oficiais pelas redes sociais ou acesse a área da Lanna para administrar o catálogo.
  </div>
  <div class="toast" id="toast"></div>

  <div class="image-editor-backdrop" id="imageEditorDialog" hidden>
    <section class="image-editor-card" id="imageEditorCard" role="dialog" aria-modal="true" aria-labelledby="imageEditorTitle">
      <header class="image-editor-header">
        <h2 id="imageEditorTitle">Visualizar desenho</h2>
        <button class="image-editor-close" id="imageEditorClose" type="button" aria-label="Fechar visualização">×</button>
      </header>
      <div class="image-editor-stage">
        <div class="image-editor-frame" id="imageEditorFrame">
          <div class="frame-content" id="imageEditorContent">
            <img id="imageEditorImage" alt="Desenho ampliado">
          </div>
        </div>
      </div>
      <p class="image-editor-hint" id="imageEditorHint"></p>
      <div class="image-editor-tools">
        <label class="image-editor-zoom">
          <span>Zoom</span>
          <input id="imageEditorZoom" type="range" min="0.4" max="3" step="0.05" value="1">
          <output id="imageEditorZoomValue" for="imageEditorZoom">100%</output>
          <button class="admin-trigger" id="imageEditorReset" type="button" title="Restaurar enquadramento">Centralizar</button>
        </label>
      </div>
      <footer class="image-editor-actions">
        <button class="btn btn-secondary" id="imageEditorCancel" type="button">Cancelar</button>
        <button class="btn btn-primary" id="imageEditorSave" type="button">Salvar ajuste</button>
      </footer>
    </section>
  </div>

  <div class="admin-backdrop" id="adminDialog" hidden>
    <section class="admin-card" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
      <button id="adminClose" type="button" class="admin-trigger" style="float:right">Fechar</button>
      <h2 id="adminTitle">Acesso da Lanna</h2>
      <form id="loginForm">
        <label>Usuário
          <input name="username" value="Lanna" autocomplete="username" readonly>
        </label>
        <label>Senha
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="admin-actions">
          <button class="btn btn-primary" type="submit">Entrar</button>
        </div>
      </form>
      <form id="adminPanel" hidden>
        <label>Título do catálogo
          <input name="title" maxlength="80" required>
        </label>
        <label>Instagram (usuário)
          <input name="instagram" maxlength="30" pattern="[A-Za-z0-9._]{1,30}" required>
        </label>
        <label>TikTok (usuário, sem @)
          <input name="tiktok" maxlength="30" pattern="[A-Za-z0-9._]{0,30}">
        </label>
        <div class="admin-actions">
          <button class="btn btn-primary" type="submit">Salvar alterações</button>
          <button class="btn btn-secondary" id="qrUploadButton" type="button">Enviar QR para impressão</button>
          <button class="btn btn-secondary" id="logoutButton" type="button">Sair</button>
        </div>
        <input id="qrUpload" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      </form>
      <p class="admin-status" id="adminStatus" role="status"></p>
    </section>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
